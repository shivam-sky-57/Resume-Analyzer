# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resumeiq}
spring.datasource.username=${DB_USERNAME:resumeiq}
spring.datasource.password=${DB_PASSWORD:resumeiq123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Groq AI
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Adzuna Jobs API
adzuna.app.id=${ADZUNA_APP_ID}
adzuna.api.key=${ADZUNA_API_KEY}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Serve Static Files
spring.web.resources.static-locations=classpath:/static/
